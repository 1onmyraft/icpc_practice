<title>Regionals Camp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: contest-scoreboard app. Header band with countdown + "who am I" balloons, tabbed panels below. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#152033; --muted:#5a6780; --line:#d8deea; --chip:#e7ecf5;
  --accent:#2a52d1; --accent-ink:#ffffff;
  --ok:#1d8549; --warn:#a86b12; --bad:#c03a34;
  --hugo:#d2443c; --tyler:#2d6be0; --edwin:#1c9555;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141f; --surface:#161e2c; --ink:#e5eaf3; --muted:#93a0b7; --line:#28324a; --chip:#1f2a3c;
  --accent:#7e9fff; --accent-ink:#0e141f; --ok:#4cc07c; --warn:#e0a94d; --bad:#ef6a60;
  --hugo:#f07068; --tyler:#71a0ff; --edwin:#4cc07c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141f; --surface:#161e2c; --ink:#e5eaf3; --muted:#93a0b7; --line:#28324a; --chip:#1f2a3c;
  --accent:#7e9fff; --accent-ink:#0e141f; --ok:#4cc07c; --warn:#e0a94d; --bad:#ef6a60;
  --hugo:#f07068; --tyler:#71a0ff; --edwin:#4cc07c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,38px);font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:16px}
.count{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.count .big{font-family:var(--f-display);font-size:44px;font-weight:800;font-stretch:75%;line-height:1}
.who{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ball{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer}
.ball[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:16px;height:19px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;flex:none;position:relative}
.dot::after{content:"";position:absolute;left:50%;bottom:-4px;width:1px;height:5px;background:var(--muted)}

nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 22px}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);padding:10px 14px;border-radius:6px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic .probs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--chip);color:var(--muted);letter-spacing:.03em}
.tag.core{color:var(--accent)}
.plink{font-family:var(--f-mono);font-size:12px;background:var(--chip);color:var(--ink);text-decoration:none;padding:3px 8px;border-radius:4px}
.plink:hover{text-decoration:underline}
.status{align-self:start;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.status[data-s="1"]{color:var(--warn);border-color:var(--warn)}
.status[data-s="2"]{color:var(--ok);border-color:var(--ok)}
.status:disabled{cursor:default}

ol.routine{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
::placeholder{color:var(--muted);opacity:.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:var(--chip);padding:4px 10px;border-radius:999px;cursor:pointer}
.scale{display:flex;gap:6px}
.scale label{flex:1;text-align:center;background:var(--chip);border-radius:6px;padding:6px 0;cursor:pointer;font-family:var(--f-mono)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale input:checked+span{font-weight:700;color:var(--accent)}
.scale label:has(input:checked){outline:2px solid var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;align-self:flex-start}
.btn:disabled{opacity:.55;cursor:default}
.msg{font-size:13px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid currentColor;align-self:flex-start}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip div{height:30px;border-radius:4px;background:var(--chip);display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:var(--muted);font-family:var(--f-mono);padding-bottom:2px;position:relative;overflow:hidden}
.strip div.on{background:color-mix(in srgb,var(--c) 30%,var(--chip));color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .v{font-family:var(--f-display);font-size:26px;font-weight:800;font-stretch:80%;line-height:1.1}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c)}
.stuck{border-left:3px solid var(--warn);padding-left:10px;font-size:14px}

.week{display:flex;flex-direction:column;gap:6px}
.planGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.events{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
tr.cat td{font-family:var(--f-display);font-weight:700;font-size:14px;background:var(--chip)}
.lv{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px;display:inline-block;min-width:44px;text-align:center}
.lv5{background:color-mix(in srgb,var(--ok) 25%,transparent)} .lv4{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.lv3{background:color-mix(in srgb,var(--warn) 20%,transparent)} .lv2{background:color-mix(in srgb,var(--warn) 10%,transparent)}
.lv1{color:var(--muted)}
.owner{display:inline-flex;align-items:center;gap:6px;font-weight:600}

.cmd{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:6px;padding:6px 6px 6px 12px;min-width:0}
.cmd code{font-family:var(--f-mono);font-size:13px;flex:1;min-width:0;overflow-x:auto;white-space:nowrap}
.copy{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;flex:none}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.dsetup{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dcard{display:flex;flex-direction:column;gap:16px}
.clue{font-family:var(--f-display);font-stretch:85%;font-size:clamp(22px,3.6vw,30px);font-weight:700;line-height:1.2;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px 14px;cursor:pointer;font:inherit;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;flex:none;margin-top:2px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.feedback{border-left:4px solid var(--ok);padding:8px 12px;background:var(--bg);border-radius:4px;display:flex;flex-direction:column;gap:4px}
.feedback.bad{border-left-color:var(--bad)}
.dprog{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.studyrow{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.studyrow:first-child{border-top:0}
.studyrow .a{font-weight:600}
input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .4s ease}}
</style>

<div class="wrap">
  <header class="top">
    <div class="stack" style="gap:4px">
      <span class="label">ICPC North America Regionals · Div 1 · Sat Nov 14</span>
      <h1>Regionals Camp</h1>
    </div>
    <div class="count">
      <div><div class="big num" id="daysLeft">–</div><div class="label">days to contest</div></div>

  <div class="row" style="margin-top:14px;justify-content:space-between">
    <div class="who" id="who" aria-label="Who are you?"><span class="label">I am</span></div>
    <span class="muted" style="font-size:13px" id="weekLabel"></span>
  </div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="banner"></div>
  <main id="view"></main>
</div>

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="style" && typeof v==="object") Object.assign(el.style,v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="text") el.textContent=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k instanceof Node?k:document.createTextNode(String(k))); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function drillOptions(card){
  const others=[...new Set(DRILL.filter(c=>c.answer!==card.answer).map(c=>c.answer))];
  const same=[...new Set(DRILL.filter(c=>c.tag===card.tag && c.answer!==card.answer).map(c=>c.answer))];
  const picks=shuffle(same.slice()).slice(0,2);
  const rest=shuffle(others.filter(o=>!picks.includes(o)));
  while(picks.length<3) picks.push(rest.pop());
  return shuffle(picks.concat([card.answer]));
}
function startDrill(onlyMissed){
  const st = myStats();
  const weakest = list => list.map(c=>[c, -(st[c.id]?.m||0), (st[c.id]?.s||0), Math.random()])
             .sort((a,b)=>a[1]-b[1]||a[2]-b[2]||a[3]-b[3]).map(x=>x[0]);
  if(onlyMissed) D.queue = shuffle(D.missed.slice());
  else if(D.tag==="mine"){
    const mine = weakest(DRILL.filter(c=>isMine(c,S.me))), other = weakest(DRILL.filter(c=>!isMine(c,S.me)));
    const nMine = Math.min(mine.length, Math.round(D.len*0.7));
    const pick = mine.slice(0,nMine).concat(other.slice(0, D.len-nMine));
    if(pick.length < D.len) pick.push(...mine.slice(nMine, nMine + D.len - pick.length));
    D.queue = shuffle(pick);
  } else D.queue = shuffle(weakest(DRILL.filter(c=>D.tag==="all"||c.tag===D.tag)).slice(0, D.len));

}
function answer(i){
  if(D.mode!=="card"||D.chosen!==null) return;
  D.chosen=i; const ok = D.opts[i]===D.card.answer;
  const st=myStats(), e=(st[D.card.id]=st[D.card.id]||{s:0,m:0});
  e.s++; D.asked++;
  if(ok){ D.right++; e.m=Math.max(0,e.m-1); }
  else { e.m++; if(!D.missed.includes(D.card)) D.missed.push(D.card); D.queue.splice(Math.min(3,D.queue.length),0,D.card); }
  scheduleSave(); render();
}

  SAVE.inflight=true;

  catch(err){ if(err&&err.code==="invalid_argument") S.canWrite=false; }

}
function drillSummary(id){

}

function handleWriteError(err,msg){
  msg.className="msg bad";
  const code = err&&err.code;
  if(code==="invalid_argument"){ S.canWrite=false; msg.textContent="This account cannot save here. Ask Tyler to share the page with you as an Editor."; renderChrome(); }
  else if(code==="quota_exceeded") msg.textContent="The team's storage is full. Tell Tyler.";
  else if(code==="resource_exhausted") msg.textContent="Too many saves at once. Wait a few seconds and try again.";
  else msg.textContent="Could not save right now. Try again in a moment.";
}

render();
(async ()=>{
  const c = window.claude;
  if(!c || !c.use){ S.dbReady=true; render(); return; }
  const [db,user] = await Promise.all([c.use("db"), c.use("user")]);
  S.db = db; S.dbReady = true;
  if(user){ try { const w = await user.can("data.write"); if(w===false) S.canWrite=false; } catch(e){} }
  render();
  if(!db) return;
  db.collection("checkins").onSnapshot(snap=>{
    S.checkins = snap.docs.map(d=>d.data()).filter(x=>x && member(x.member) && /^\d{4}-\d{2}-\d{2}$/.test(x.date||""));
    maybeRender();
  }, e=>{ S.dbError="Live updates stopped. Reload the page to reconnect."; render(); });
  db.collection("drill").onSnapshot(snap=>{
    for(const d of snap.docs){ if(!member(d.id)) continue;
      if(d.id===S.me && SAVE.pending) continue;       // keep unsaved local answers
      const x=d.data(); S.drillStats[d.id]=(x&&x.stats)||{}; }
    if(S.tab!=="drill") maybeRender();
  }, e=>{ S.dbError="Live updates stopped. Reload the page to reconnect."; render(); });
  db.collection("progress").onSnapshot(snap=>{
    const p={}; for(const d of snap.docs){ if(member(d.id)){ const x=d.data(); p[d.id]=(x&&x.topics)||{}; } }
    S.progress=p; maybeRender();
  }, e=>{ S.dbError="Live updates stopped. Reload the page to reconnect."; render(); });
})();
/* never redraw the Today tab while someone is typing in the check-in form */
function maybeRender(){
  const a = document.activeElement;
  if(S.tab==="today" && a && a.closest && a.closest("form")) { renderChrome(); return; }
  render();
}
})();
</script>
